[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-sources"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "beautifulsoup4>=4.14,<5",
    "jsonschema==4.23.0",
    "pdfplumber>=0.11,<0.12",
    "rdflib>=7.1,<8",
]

[project.scripts]
kb-sources = "kb_sources.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb_sources = ["schemas/*.json"]
