[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-vocab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.1,<8",
    "pyparsing>=3,<4",
    "defusedxml>=0.7.1,<1",
    "pyshacl>=0.30,<0.32",
]

[project.scripts]
kb-vocab = "kb_vocab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb_vocab = ["policies/*.json"]
