[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-topics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["kb-core==0.1.0", "PyYAML==6.0.3"]

[project.scripts]
kb-topics = "kb_topics.build:main"

[tool.uv.sources]
kb-core = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
