[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-vocab-shacl"
version = "0.1.0"
description = "Independent SHACL resources for the kb-design vocabulary model"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8"]

[project.scripts]
kb-vocab-shacl = "kb_vocab_shacl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kb_vocab_shacl = ["shapes/*.ttl"]
