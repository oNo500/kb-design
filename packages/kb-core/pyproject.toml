[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.23.0"]

[project.scripts]
kb-core = "kb_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
