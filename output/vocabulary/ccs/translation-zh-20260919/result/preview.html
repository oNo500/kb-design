<script>
const data=JSON.parse(document.getElementById('data').textContent);
document.getElementById('title').textContent=data.title;
document.title=data.title+' · 分类树';
document.getElementById('meta').textContent=data.count.toLocaleString()+' 个概念 · 点击箭头展开分类';
function branch(id,ancestors){
  const node=data.nodes[id],li=document.createElement('li');
  const cycle=ancestors.has(id);
  if(cycle || !node.children.length){
    const row=document.createElement('div');row.className='leaf';row.textContent=node.label;row.title=id;
    if(cycle){const hint=document.createElement('span');hint.className='hint';hint.textContent='循环引用，停止展开';row.append(hint);}
    li.append(row);return li;
  }
  const detail=document.createElement('details'),summary=document.createElement('summary');
  const name=document.createElement('span');name.textContent=node.label;summary.append(name);summary.title=id;
  const count=document.createElement('span');count.className='count';count.textContent=node.children.length;summary.append(count);
  detail.append(summary);li.append(detail);
  let loaded=false;
  detail.addEventListener('toggle',()=>{
    if(!detail.open || loaded)return;
    loaded=true;const list=document.createElement('ul');const path=new Set(ancestors);path.add(id);
    for(const child of node.children)list.append(branch(child,path));
    detail.append(list);
  });
  return li;
}
const tree=document.getElementById('tree');
for(const id of data.roots){
  const item=branch(id,new Set());
  if(data.extra_roots.includes(id))item.title='该部分没有可达的顶层入口，作为补充浏览入口显示';
  tree.append(item);
}
if(!data.roots.length){const empty=document.createElement('li');empty.className='empty';empty.textContent='没有声明为 skos:Concept 的概念。';tree.append(empty);}
</script>
