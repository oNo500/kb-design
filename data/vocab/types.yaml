# 文档类型词表。设计见 design/content-model.md。
version:
  id: "2026.08"
  date: 2026-08-23
  note: Diátaxis 四类加 DITA 两类

types:
  - id: tutorial
    label: { zh: 教程, en: Tutorial }
    scope: 读者为了学习、动手做一遍；带着做，保证成功
    match: [{ source: diataxis, id: tutorials, rel: exactMatch }]
    status: active
    added: 2026-08-23
  - id: how-to
    label: { zh: 操作指南, en: How-to guide }
    scope: 读者为了完成一个具体任务；步骤，不解释
    match: [{ source: diataxis, id: how-to-guides, rel: exactMatch }, { source: schema-org, id: HowTo, rel: closeMatch }]
    status: active
    added: 2026-08-23
  - id: reference
    label: { zh: 参考, en: Reference }
    scope: 读者为了查阅事实；克制中立，结构镜像被描述的对象
    match: [{ source: diataxis, id: reference, rel: exactMatch }, { source: schema-org, id: TechArticle, rel: closeMatch }]
    status: active
    added: 2026-08-23
  - id: explanation
    label: { zh: 解释, en: Explanation }
    scope: 读者为了理解为什么；讨论，多角度，承认观点
    match: [{ source: diataxis, id: explanation, rel: exactMatch }]
    status: active
    added: 2026-08-23
  - id: troubleshooting
    label: { zh: 排障, en: Troubleshooting }
    scope: 读者为了纠正一个已出现的问题；症状、原因、处理
    match: [{ source: dita, id: "2.7.1.6", rel: exactMatch }]
    status: active
    added: 2026-08-23
  - id: glossary-entry
    label: { zh: 术语条目, en: Glossary entry }
    scope: 一个术语的一个义项
    match: [{ source: dita, id: "2.7.1.7", rel: exactMatch }]
    status: active
    added: 2026-08-23
