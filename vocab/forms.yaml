    zh:
      level: 5
      model:
        name: gpt-6-astra
        date: '2026-09-05'
        rationale: 按现有范围指数据的图形化表达，区别于行列表格、结构示意图及图论中的图。
        approval: design/decisions/structured-label-basis.md#批次授权
