# 载体词表。设计见 design/content-model.md「载体词表」。取值来自 IEEE 1484.12.1-2002 LOM §5.2 Learning Resource Type，拆为两个数组；速查表据 Wikidata。
version:
  id: "2026.08"
  date: 2026-08-23
  note: 初版：LOM 的 15 个取值分两组，加速查表。中文标签按译名阶梯第 4 级不译（2026-08-23），解释在 scope

arrays:
