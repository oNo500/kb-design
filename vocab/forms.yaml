# 载体词表。设计见 design/content-model.md。
version:
  id: '2026.08'
  date: 2026-08-23
  note: 初版：LOM 的 15 个取值分两组，加速查表。中文标签按译名阶梯第 4 级不译（2026-08-23），解释在 scope
arrays:
- id: forms-presentation
  superordinate: forms
  source: lom
- id: forms-activity
  superordinate: forms
  source: lom
forms:
- id: diagram
  label:
    en: Diagram
    zh: 示意图
  basis:
    zh:
      level: 5
      model:
        name: gpt-6-astra
        date: '2026-09-05'
        rationale: 指用线条与符号表达结构或过程的图，区别于照片插图类图像及数据关系图表。
        approval: design/decisions/structured-label-basis.md#批次授权
    en:
      level: 1
      references:
      - source: lom
        locator: diagram
  arrays:
  - forms-presentation
  match:
  - source: lom
    id: diagram
    rel: exactMatch
  scope: 示意图：用线条和符号表示结构或过程
  status: unassigned
  added: 2026-08-23
- id: figure
  label:
    en: Figure
    zh: 图像
  basis:
    zh:
      level: 5
      model:
        name: gpt-6-astra
        date: '2026-09-05'
        rationale: 按现有范围指照片、插图等非示意性图像；不取数字、人物或笼统的所有附图义，也不并入示意图。
        approval: design/decisions/structured-label-basis.md#批次授权
    en:
      level: 1
      references:
      - source: lom
        locator: figure
  arrays:
  - forms-presentation
  match:
  - source: lom
    id: figure
    rel: exactMatch
  scope: 图像：照片、插图等非示意性的图
  status: unassigned
  added: 2026-08-23
- id: graph
  label:
    en: Graph
    zh: 图表
