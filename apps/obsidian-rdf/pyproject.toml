[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-obsidian-rdf"
version = "0.4.0"
description = "RDF vocabulary lookup and article metadata support for Obsidian"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.1,<8", "PyYAML>=6,<7", "pyshacl>=0.30,<1", "kb-vocab-shacl", "kb-vocab-maintenance", "markdown-it-py>=4,<5"]

[tool.uv.sources]
kb-vocab-shacl = { workspace = true }
kb-vocab-maintenance = { workspace = true }

[project.scripts]
kb-obsidian-rdf = "kb_obsidian_rdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
